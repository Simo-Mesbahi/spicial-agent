name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - run: npm run typecheck
      - run: npm run lint:app
      - run: npm test
      - run: npm run check:regressions
      - run: npm run test:origin-runtime
      - run: npm run eval:ai
      - run: npm run eval:rag
      - run: npm run eval:generation
      - run: npm run eval:grounding
      - run: npm run eval:p1:release
      - run: npm run build
      - run: npm run test:starter
      - name: Browser admin regression checks
        run: npm run test:admin-ui
      - name: Admin browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-browser-evidence
          path: outputs/admin-ui
          if-no-files-found: ignore
          retention-days: 7
