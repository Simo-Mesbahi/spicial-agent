name: Public showcase evidence

on:
  push:
    branches: [main]
    paths:
      - 'app/page.tsx'
      - 'app/demo/**'
      - 'app/trial/**'
      - 'app/showcase.css'
      - 'app/layout.tsx'
      - 'scripts/smoke-public-showcase.mjs'
      - 'tests/atlas-public-showcase.test.mjs'
      - '.github/workflows/showcase-evidence.yml'
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/demo/**'
      - 'app/trial/**'
      - 'app/showcase.css'
      - 'app/layout.tsx'
      - 'scripts/smoke-public-showcase.mjs'
      - 'tests/atlas-public-showcase.test.mjs'
      - '.github/workflows/showcase-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_PROVIDER: demo
      LLM_BUDGET_MODE: zero
      P1_RELEASE_MODE: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Enforce showcase boundaries
        run: node --test tests/atlas-public-showcase.test.mjs
      - name: Capture public browser evidence
        run: node scripts/smoke-public-showcase.mjs
      - name: Upload public showcase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-showcase-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: outputs/public-showcase/
          if-no-files-found: warn
          retention-days: 7
