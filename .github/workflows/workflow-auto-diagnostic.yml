name: Workflow Auto Diagnostic

on:
  workflow_run:
    workflows:
      - Quality checks
      - P1.7 live qualification
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed workflow run ID to diagnose
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: workflow-diagnostic-${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Resolve target run
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$DISPATCH_RUN_ID"
          else
            run_id="$AUTO_RUN_ID"
          fi
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid diagnostic run ID::run_id must be a positive integer."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Fetch bounded diagnostic inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ steps.target.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics/input/logs diagnostics/input/artifacts diagnostics/output
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"

          curl --fail-with-body --silent --show-error --location \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$TARGET_RUN_ID" \
            --output diagnostics/input/run.json

          curl --fail-with-body --silent --show-error --location \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$TARGET_RUN_ID/jobs?per_page=100" \
            --output diagnostics/input/jobs.json

          node - <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync('diagnostics/input/run.json', 'utf8'));
          const jobs = JSON.parse(fs.readFileSync('diagnostics/input/jobs.json', 'utf8'));
          const expectedRepo = process.env.GITHUB_REPOSITORY;
          const expectedRunId = Number(process.env.TARGET_RUN_ID);
          const allowed = new Set(['Quality checks', 'P1.7 live qualification']);

          if (run?.repository?.full_name !== expectedRepo) {
            throw new Error('Target run does not belong to this repository.');
          }
          if (run?.id !== expectedRunId) throw new Error('Target run identity mismatch.');
          if (run?.status !== 'completed' || run?.conclusion !== 'failure') {
            throw new Error('Only completed failed runs can be diagnosed.');
          }
          if (!allowed.has(run?.name)) throw new Error('Target workflow is not allowlisted.');
          if (!Array.isArray(jobs?.jobs) || jobs.total_count > 100) {
            throw new Error('Jobs payload exceeds the bounded diagnostic contract.');
          }

          const failed = jobs.jobs
            .filter((job) => job?.conclusion === 'failure' && Number.isSafeInteger(job?.id))
            .slice(0, 20)
            .map((job) => job.id);
          fs.writeFileSync(
            'diagnostics/input/failed-jobs.txt',
            failed.join('\n') + (failed.length ? '\n' : ''),
          );
          NODE

          while IFS= read -r job_id; do
            [[ -z "$job_id" ]] && continue
            curl --fail-with-body --silent --show-error --location \
              --retry 2 --retry-delay 2 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/actions/jobs/$job_id/logs" \
              --output "diagnostics/input/logs/$job_id.log"
          done < diagnostics/input/failed-jobs.txt

          curl --fail-with-body --silent --show-error --location \
            --retry 2 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api/actions/runs/$TARGET_RUN_ID/artifacts?per_page=100" \
            --output diagnostics/input/artifacts.json

          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('diagnostics/input/artifacts.json', 'utf8'));
          if (!Array.isArray(payload?.artifacts) || payload.total_count > 100) {
            throw new Error('Artifact listing exceeds the bounded diagnostic contract.');
          }
          const selected = payload.artifacts
            .filter((artifact) =>
              artifact &&
              artifact.expired !== true &&
              Number.isSafeInteger(artifact.id) &&
              typeof artifact.name === 'string' &&
              /^p1-live-qualification-[a-f0-9]{40,64}$/i.test(artifact.name)
            )
            .slice(0, 2)
            .map((artifact) => artifact.id);
          fs.writeFileSync(
            'diagnostics/input/artifact-ids.txt',
            selected.join('\n') + (selected.length ? '\n' : ''),
          );
          NODE

          while IFS= read -r artifact_id; do
            [[ -z "$artifact_id" ]] && continue
            zip_path="diagnostics/input/artifact-$artifact_id.zip"
            target_dir="diagnostics/input/artifacts/$artifact_id"
            mkdir -p "$target_dir"
            curl --fail-with-body --silent --show-error --location \
              --retry 2 --retry-delay 2 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/actions/artifacts/$artifact_id/zip" \
              --output "$zip_path"

            python3 - "$zip_path" "$target_dir" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          max_files = 100
          max_file = 2 * 1024 * 1024
          max_total = 20 * 1024 * 1024

          with zipfile.ZipFile(archive) as bundle:
              selected = []
              total = 0
              for info in bundle.infolist():
                  name = info.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(name).parts
                  if (
                      info.is_dir()
                      or pathlib.PurePosixPath(name).is_absolute()
                      or ".." in parts
                      or pathlib.PurePosixPath(name).suffix.lower() != ".json"
                  ):
                      continue
                  if info.file_size > max_file:
                      continue
                  total += info.file_size
                  if total > max_total:
                      raise SystemExit("Artifact JSON exceeds total byte limit.")
                  selected.append(info)
                  if len(selected) > max_files:
                      raise SystemExit("Too many artifact JSON files.")

              for index, info in enumerate(selected):
                  data = bundle.read(info)
                  safe_name = f"{index:03d}-{pathlib.PurePosixPath(info.filename).name}"
                  (destination / safe_name).write_bytes(data)
          PY
            rm -f "$zip_path"
          done < diagnostics/input/artifact-ids.txt

      - name: Generate safe workflow diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-workflow-diagnostic.mjs \
            --run diagnostics/input/run.json \
            --jobs diagnostics/input/jobs.json \
            --logs-dir diagnostics/input/logs \
            --artifacts-dir diagnostics/input/artifacts \
            --output diagnostics/output/workflow-diagnostic.json \
            --summary diagnostics/output/diagnostic-summary.md
          cat diagnostics/output/diagnostic-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-diagnostic-${{ steps.target.outputs.run_id }}
          path: diagnostics/output/
          if-no-files-found: error
          retention-days: 30
